[project]
name = "curso-databricks-wizard"
version = "0.1.0"
description = "Scripts y laboratorios del curso Databricks Wizard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyodbc>=5.3.0",
]

[project.optional-dependencies]
azuresql = [
    "pyodbc>=5.2.0",
]
postgres = [
    "psycopg2-binary>=2.9.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["src/bronze/sql_server"]
