resources:
  jobs:
    pl_wizardbank_bronze_query_job:
      name: pl_wizardbank_bronze_query job
      max_concurrent_runs: 1

      trigger:
        pause_status: PAUSED
        periodic:
          interval: 1
          unit: DAYS

      tasks:
        - task_key: despertar_bd
          notebook_task:
            notebook_path: ../src/despertar_bd.py

        - task_key: pl_wizardbank_bronze_query_job
          depends_on:
            - task_key: despertar_bd
          pipeline_task:
            pipeline_id: ${resources.pipelines.pl_wizardbank_bronze_query.id}
