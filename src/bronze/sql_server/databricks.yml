# Declarative Automation Bundle: Lakeflow Connect (SQL Server / Azure SQL, query-based) -> Bronze.
# El workspace destino se elige al desplegar con el perfil: databricks bundle deploy -p <perfil>
bundle:
  name: sql_server
  uuid: baadcbec-5ece-4dfd-9306-8c306f5185d5

include:
  - resources/pl_wizardbank_bronze_query.*.yml

variables:
  connection_name:
    description: Conexión de Unity Catalog al SQL Server
  source_catalog:
    description: Base de datos de origen en el SQL Server
  catalog:
    description: Catálogo destino (capa bronze)
  schema:
    description: Schema destino dentro del catálogo

targets:
  dev:
    # Sin 'mode: development' a propósito: renombraría el pipeline y el job con el prefijo del usuario.
    default: true
    variables:
      connection_name: wizardbank_sqlserver
      source_catalog: dbwizardunique-lab-db
      catalog: bronze_dev
      schema: lending
