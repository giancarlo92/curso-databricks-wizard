# Primero se sincroniza el catálogo y el schema control (DDL + configuración); luego un task por grupo_ejecucion de
# ctl_objetos. Dar de alta una tabla nueva es una fila en crear_control.py; el job no cambia.
resources:
  jobs:
    ingesta_metadata_driven:
      name: ingesta_metadata_driven

      schedule:
        # Todos los días a las 12:00 a.m. (hora de Lima), pausado: se ejecuta a mano.
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: America/Lima
        pause_status: PAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: crear_control
          notebook_task:
            notebook_path: ../src/crear_control.py
            base_parameters:
              catalogo: ${var.catalog}

        - task_key: despertar_bd
          notebook_task:
            notebook_path: ../src/despertar_bd.py

        - task_key: cobranzas
          depends_on:
            - task_key: crear_control
          notebook_task:
            notebook_path: ../src/motor_ingesta.py
            base_parameters:
              grupo: cobranzas
              catalogo_ctl: ${var.catalog}
              landing_path: ${var.landing_path}
              checkpoint_path: ${var.checkpoint_path}/${var.checkpoint_version}
              job_run_id: "{{job.run_id}}"

        - task_key: telemetria
          depends_on:
            - task_key: crear_control
          notebook_task:
            notebook_path: ../src/motor_ingesta.py
            base_parameters:
              grupo: telemetria
              catalogo_ctl: ${var.catalog}
              landing_path: ${var.landing_path}
              checkpoint_path: ${var.checkpoint_path}/${var.checkpoint_version}
              job_run_id: "{{job.run_id}}"

        - task_key: catalogos
          depends_on:
            - task_key: crear_control
            - task_key: despertar_bd
          notebook_task:
            notebook_path: ../src/motor_ingesta.py
            base_parameters:
              grupo: catalogos
              catalogo_ctl: ${var.catalog}
              landing_path: ${var.landing_path}
              checkpoint_path: ${var.checkpoint_path}/${var.checkpoint_version}
              job_run_id: "{{job.run_id}}"

        - task_key: transaccional
          depends_on:
            - task_key: crear_control
            - task_key: despertar_bd
          notebook_task:
            notebook_path: ../src/motor_ingesta.py
            base_parameters:
              grupo: transaccional
              catalogo_ctl: ${var.catalog}
              landing_path: ${var.landing_path}
              checkpoint_path: ${var.checkpoint_path}/${var.checkpoint_version}
              job_run_id: "{{job.run_id}}"
